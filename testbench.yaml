providers:
  - Laravel\Telescope\TelescopeServiceProvider
  - TelescopeMonitor\TelescopeMonitorServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider
migrations:
  - database/migrations
  - vendor/laravel/telescope/database/migrations
workbench:
  start: '/telescope-monitor/setup'
  install: true
  discovers:
    web: true
    api: false
    commands: false
    views: false

name: Release verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, pdo_sqlite, mbstring, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: php workbench/build.php
      - run: composer test
      - run: composer analyse
      - run: composer format:check
      - run: git diff --exit-code -- dist
  database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:8.4', 'mariadb:11.4']
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: telescope_monitor_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptesting || mariadb-admin ping -h localhost -ptesting"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MONITOR_DB: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: telescope_monitor_test
      DB_USERNAME: root
      DB_PASSWORD: testing
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_mysql, mbstring, pcntl
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer test

  dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: [lowest, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_sqlite, mbstring, pcntl
          coverage: none
      - if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist
      - if: matrix.dependencies == 'latest'
        run: composer update --prefer-stable --no-interaction --prefer-dist
      - run: composer audit --locked
      - run: composer test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring
          coverage: none
      - run: composer validate --strict
      - run: python3 scripts/prepare-release.py --version 1.0.0-rc.1 --output /tmp/composer-package
      - run: python3 scripts/prepare-release.py --version 1.0.0-rc.1 --git-ref HEAD --output /tmp/git-package
      - run: diff /tmp/composer-package/FILES.sha256 /tmp/git-package/FILES.sha256
